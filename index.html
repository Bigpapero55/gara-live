<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Classifica Live Gara</title>
    <style>
        html, body {
            height: 100%;
            margin: 0;
        }
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f4f9;
            display: flex;
            flex-direction: column;
            height: 100vh;
            overflow: hidden;
        }

        /* --- Parte alta fissa --- */
        .header-area {
            flex: 0 0 auto;
            padding: 20px 20px 0 20px;
            background-color: #f4f4f9;
        }

        h1 { text-align: center; color: #333; margin: 0 0 5px 0; }
        h3 { text-align: center; color: #666; font-weight: normal; margin: 0 0 15px 0; }

        .tabs {
            display: flex;
            justify-content: center;
            gap: 10px;
            margin-bottom: 10px;
            flex-wrap: wrap;
        }
        .tab {
            padding: 10px 20px;
            background: #e0e0e0;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-size: 16px;
            font-weight: bold;
            color: #333;
        }
        .tab.active {
            background: #007BFF;
            color: white;
        }

        /* --- Contenitore tabella scrollabile --- */
        .tabella-container {
            flex: 1 1 auto;
            overflow-y: auto;
            padding: 0 20px 20px 20px;
        }

        table {
            width: 100%;
            border-collapse: separate;
            border-spacing: 0;
            background: white;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
        }
        th, td {
            padding: 12px;
            text-align: left;
            border-bottom: 1px solid #ddd;
        }
        th {
            background-color: #007BFF;
            color: white;
            position: sticky;
            top: 0;
            z-index: 10;
            border-bottom: 2px solid #0056b3;
        }
        tr:nth-child(even) { background-color: #f8f9fa; }

        /* Colore solo per la cella del nome */
        td.nome-maschio { color: #007BFF; font-weight: bold; }
        td.nome-femmina { color: #E91E63; font-weight: bold; }

        /* ============================================
           MOBILE: compatta il blocco superiore
           ============================================ */
        @media (max-width: 600px) {
            .header-area {
                padding: 8px 10px 0 10px;
            }
            h1 {
                font-size: 18px;
                margin: 0 0 2px 0;
            }
            h3 {
                font-size: 13px;
                margin: 0 0 8px 0;
            }
            .tabs {
                gap: 6px;
                margin-bottom: 6px;
            }
            .tab {
                padding: 6px 10px;
                font-size: 13px;
            }
            .tabella-container {
                padding: 0 6px 6px 6px;
            }
            th, td {
                padding: 6px 4px;
                font-size: 13px;
            }
        }
    </style>
</head>
<body>

    <div class="header-area">
        <h1>⏱️ CLASSIFICA LIVE GARA</h1>
        <h3 id="info-gara">Caricamento informazioni gara...</h3>

        <div class="tabs">
            <button class="tab" data-percorso="1" onclick="cambiaPercorso('1')">Percorso 1</button>
            <button class="tab" data-percorso="2" onclick="cambiaPercorso('2')">Percorso 2</button>
            <button class="tab" data-percorso="3" onclick="cambiaPercorso('3')">Percorso 3</button>
        </div>
    </div>

    <div class="tabella-container">
        <table>
            <thead>
                <tr>
                    <th>Pos</th>
                    <th>M/F</th>
                    <th>Cat</th>
                    <th>Pett.</th>
                    <th>Atleta</th>
                    <th>Categoria</th>
                    <th>Tempo e Media</th>
                </tr>
            </thead>
            <tbody id="tabella-corpi">
                <tr><td colspan='7' style='text-align:center;'>Nessun arrivo registrato al momento.</td></tr>
            </tbody>
        </table>
    </div>

    <script>
        const URL_INFO = "https://rtt-live-default-rtdb.europe-west1.firebasedatabase.app/classifica_live/info.json";
        const URL_ATLETI = "https://rtt-live-default-rtdb.europe-west1.firebasedatabase.app/classifica_live/atleti.json";

        let percorsoAttivo = "1";
        let nomiPercorsi = { "1": "Percorso 1", "2": "Percorso 2", "3": "Percorso 3" };

        function leggiPercorsoDaURL() {
            const params = new URLSearchParams(window.location.search);
            const p = params.get("percorso");
            if (p === "1" || p === "2" || p === "3") return p;
            return "1";
        }

        function aggiornaTab() {
            document.querySelectorAll(".tab").forEach(tab => {
                const p = tab.dataset.percorso;
                tab.textContent = nomiPercorsi[p] || ("Percorso " + p);
                tab.classList.toggle("active", p === percorsoAttivo);
            });
        }

        function cambiaPercorso(p) {
            percorsoAttivo = p;

            const url = new URL(window.location);
            url.searchParams.set("percorso", p);
            window.history.replaceState({}, "", url);

            aggiornaTab();
            caricaClassifica();
        }

        async function caricaInfo() {
            try {
                const resInfo = await fetch(URL_INFO);
                const dataInfo = await resInfo.json();

                const infoGaraEl = document.getElementById('info-gara');
                if (dataInfo && dataInfo.nome_gara) {
                    infoGaraEl.innerHTML = `<b>${dataInfo.nome_gara}</b> - ${dataInfo.data_gara}`;
                } else {
                    infoGaraEl.innerHTML = "Gara Live";
                }

                if (dataInfo) {
                    if (dataInfo.percorso_1) nomiPercorsi["1"] = dataInfo.percorso_1;
                    if (dataInfo.percorso_2) nomiPercorsi["2"] = dataInfo.percorso_2;
                    if (dataInfo.percorso_3) nomiPercorsi["3"] = dataInfo.percorso_3;
                }
                aggiornaTab();

            } catch (error) {
                console.error("Errore nel caricamento info:", error);
            }
        }

        async function caricaClassifica() {
            try {
                const resAtleti = await fetch(URL_ATLETI);
                const dataAtleti = await resAtleti.json();
                const tbody = document.getElementById('tabella-corpi');

                if (!dataAtleti) {
                    tbody.innerHTML = "<tr><td colspan='7' style='text-align:center;'>Nessun arrivo registrato al momento.</td></tr>";
                    return;
                }

                const lista = Object.values(dataAtleti)
                    .filter(a => a && String(a.percorso) === percorsoAttivo)
                    .sort((a, b) => {
                        const pa = parseInt(a.pos_ass) || 9999;
                        const pb = parseInt(b.pos_ass) || 9999;
                        return pa - pb;
                    });

                if (lista.length === 0) {
                    tbody.innerHTML = "<tr><td colspan='7' style='text-align:center;'>Nessun arrivo registrato per questo percorso.</td></tr>";
                    return;
                }

                tbody.innerHTML = "";

                lista.forEach(atleta => {
                    const row = document.createElement('tr');

                    const sesso = (atleta.sesso || "").toUpperCase();
                    let classeNome = "";
                    if (sesso === "M") classeNome = "nome-maschio";
                    else if (sesso === "F") classeNome = "nome-femmina";

                    row.innerHTML = `
                        <td><b>${atleta.pos_ass || ""}</b></td>
                        <td>${atleta.pos_mf || ""}</td>
                        <td>${atleta.pos_cat || ""}</td>
                        <td>${atleta.pettorale || ""}</td>
                        <td class="${classeNome}">${atleta.nome || ""}</td>
                        <td>${atleta.cat_nome || ""}</td>
                        <td><b>${atleta.tempo || ""}</b></td>
                    `;
                    tbody.appendChild(row);
                });

            } catch (error) {
                console.error("Errore nel caricamento dei dati:", error);
            }
        }

        percorsoAttivo = leggiPercorsoDaURL();
        aggiornaTab();
        caricaInfo();
        caricaClassifica();

        setInterval(caricaInfo, 10000);
        setInterval(caricaClassifica, 2000);
    </script>
</body>
</html>
