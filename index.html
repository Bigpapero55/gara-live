<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Classifica Live Gare</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 20px; background-color: #f4f4f9; }
        h1 { text-align: center; color: #333; margin-bottom: 5px; }
        h3 { text-align: center; color: #666; font-weight: normal; margin-top: 0; margin-bottom: 20px; }

        .tabs { display: flex; justify-content: center; gap: 10px; margin-bottom: 20px; flex-wrap: wrap; }
        .tab {
            padding: 10px 20px; background: #e0e0e0; border: none;
            border-radius: 6px; cursor: pointer; font-size: 16px;
            font-weight: bold; color: #333;
        }
        .tab.active { background: #007BFF; color: white; }

        #banner-rete {
            display: none; position: fixed; top: 0; left: 0; right: 0;
            background: #ff9800; color: white; text-align: center;
            padding: 8px; font-weight: bold; z-index: 999;
        }
        #banner-rete.visibile { display: block; }
        #banner-rete.ok { background: #4caf50; }
        body.offline { padding-top: 40px; }

        table { width: 100%; border-collapse: collapse; margin-top: 20px; background: white; box-shadow: 0 2px 5px rgba(0,0,0,0.1); }
        th, td { padding: 12px; text-align: left; border-bottom: 1px solid #ddd; }
        th { background-color: #007BFF; color: white; position: sticky; top: 0; }
        tr:nth-child(even) { background-color: #f8f9fa; }
    </style>
</head>
<body>

    <div id="banner-rete">⚠️ Riconnessione in corso...</div>

    <h1>⏱️ CLASSIFICA LIVE GARE</h1>
    <h3 id="info-gara">Caricamento...</h3>

    <div class="tabs" id="tabs-gare"></div>
    <div class="tabs" id="tabs-percorsi" style="margin-top: -10px;"></div>

    <table>
        <thead>
            <tr>
                <th>Pos</th>
                <th>M/F</th>
                <th>Cat</th>
                <th>Pett.</th>
                <th>Atleta</th>
                <th>Società</th>
                <th>Categoria</th>
                <th>Tempo e Media</th>
            </tr>
        </thead>
        <tbody id="tabella-corpi">
            <tr><td colspan='8' style='text-align:center;'>Nessun arrivo registrato al momento.</td></tr>
        </tbody>
    </table>

    <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-database-compat.js"></script>

    <script>
        // ==========================================
        // CONFIGURAZIONE
        // ==========================================
        const firebaseConfig = {
            databaseURL: "https://rtt-live-default-rtdb.europe-west1.firebasedatabase.app"
        };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();

        // ==========================================
        // STATO
        // ==========================================
        let garaAttiva = null;
        let percorsoAttivo = "1";
        let percorsiDisponibili = ["1", "2", "3"];
        let listaGare = [];
        let infoCache = {};
        let atletiCache = {};
        let listenerAttivi = {};
        let ultimoHashTabella = "";

        // ==========================================
        // UTILITIES
        // ==========================================
        function leggiStatoDaURL() {
            const params = new URLSearchParams(window.location.search);
            const g = params.get("gara");
            const p = params.get("percorso");
            if (g) garaAttiva = g;
            if (p) percorsoAttivo = p;
        }

        function scriviStatoSuURL() {
            const url = new URL(window.location);
            if (garaAttiva) url.searchParams.set("gara", garaAttiva);
            url.searchParams.set("percorso", percorsoAttivo);
            window.history.replaceState({}, "", url);
        }

        function cambiaGara(idGara) {
            garaAttiva = idGara;
            ultimoHashTabella = "";
            const info = infoCache[garaAttiva];
            if (info) {
                percorsiDisponibili = calcolaPercorsiDisponibili(info);
                if (!percorsiDisponibili.includes(percorsoAttivo)) {
                    percorsoAttivo = percorsiDisponibili[0] || "1";
                }
            } else {
                percorsoAttivo = "1";
            }
            scriviStatoSuURL();
            disegnaTabsGare();
            disegnaTabsPercorsi();
            aggiornaIntestazione();
            aggiornaTabella();
        }

        function cambiaPercorso(p) {
            percorsoAttivo = p;
            scriviStatoSuURL();
            disegnaTabsPercorsi();
            ultimoHashTabella = "";
            aggiornaTabella();
        }

        function calcolaPercorsiDisponibili(info) {
            return ["1", "2", "3"];
        }

        function hashLista(lista) {
            let s = "";
            for (const a of lista) {
                s += (a.pettorale || "") + "|" + (a.pos_ass || "") + "|" + (a.tempo || "") + ";";
            }
            let h = 5381;
            for (let i = 0; i < s.length; i++) h = ((h << 5) + h + s.charCodeAt(i)) | 0;
            return String(h);
        }

        function mostraBannerRete(stato) {
            const banner = document.getElementById("banner-rete");
            if (stato === "offline") {
                banner.textContent = "⚠️ Riconnessione in corso...";
                banner.classList.add("visibile"); banner.classList.remove("ok");
                document.body.classList.add("offline");
            } else if (stato === "ok") {
                banner.textContent = "✅ Connesso";
                banner.classList.add("visibile", "ok");
                document.body.classList.add("offline");
                setTimeout(() => {
                    banner.classList.remove("visibile", "ok");
                    document.body.classList.remove("offline");
                }, 1500);
            } else {
                banner.classList.remove("visibile", "ok");
                document.body.classList.remove("offline");
            }
        }

        // ==========================================
        // DISEGNO TAB
        // ==========================================
        function disegnaTabsGare() {
            const cont = document.getElementById("tabs-gare");
            if (listaGare.length === 0) {
                cont.innerHTML = "";
                return;
            }
            let html = "";
            for (const g of listaGare) {
                const info = infoCache[g.id];
                const label = (info && info.nome_gara) ? info.nome_gara : g.id;
                const active = (g.id === garaAttiva) ? " active" : "";
                html += `<button class="tab${active}" data-gara="${g.id}" onclick="cambiaGara('${g.id}')">${label}</button>`;
            }
            cont.innerHTML = html;
        }

        function disegnaTabsPercorsi() {
            const cont = document.getElementById("tabs-percorsi");
            if (!garaAttiva) { cont.innerHTML = ""; return; }
            const info = infoCache[garaAttiva] || {};
            let html = "";
            for (const p of percorsiDisponibili) {
                const nome = info["percorso_" + p];
                const label = (nome && String(nome).trim() !== "") ? nome : ("Percorso " + p);
                const active = (p === percorsoAttivo) ? " active" : "";
                html += `<button class="tab${active}" data-percorso="${p}" onclick="cambiaPercorso('${p}')">${label}</button>`;
            }
            cont.innerHTML = html;
        }

        // ==========================================
        // INTESTAZIONE INFO GARA
        // ==========================================
        function aggiornaIntestazione() {
            const el = document.getElementById("info-gara");
            if (!garaAttiva) { el.textContent = "Nessuna gara attiva"; return; }
            const info = infoCache[garaAttiva];
            if (info && info.nome_gara) {
                el.innerHTML = `<b>${info.nome_gara}</b> - ${info.data_gara || ""}`;
            } else {
                el.textContent = garaAttiva;
            }
        }

        // ==========================================
        // TABELLA
        // ==========================================
        function aggiornaTabella() {
            const tbody = document.getElementById('tabella-corpi');
            if (!garaAttiva) {
                tbody.innerHTML = "<tr><td colspan='8' style='text-align:center;'>Nessuna gara disponibile.</td></tr>";
                return;
            }
            const dataAtleti = atletiCache[garaAttiva];

            if (!dataAtleti) {
                if (ultimoHashTabella !== "vuoto-" + garaAttiva) {
                    tbody.innerHTML = "<tr><td colspan='8' style='text-align:center;'>Nessun arrivo registrato al momento.</td></tr>";
                    ultimoHashTabella = "vuoto-" + garaAttiva;
                }
                return;
            }

            const lista = Object.values(dataAtleti)
                .filter(a => a && String(a.percorso) === percorsoAttivo)
                .sort((a, b) => (parseInt(a.pos_ass) || 9999) - (parseInt(b.pos_ass) || 9999));

            if (lista.length === 0) {
                if (ultimoHashTabella !== "vuoto-" + garaAttiva + "-" + percorsoAttivo) {
                    tbody.innerHTML = "<tr><td colspan='8' style='text-align:center;'>Nessun arrivo registrato per questo percorso.</td></tr>";
                    ultimoHashTabella = "vuoto-" + garaAttiva + "-" + percorsoAttivo;
                }
                return;
            }

            const nuovoHash = garaAttiva + "-" + percorsoAttivo + "-" + hashLista(lista);
            if (nuovoHash === ultimoHashTabella) return;

            let html = "";
            for (const atleta of lista) {
                html += `
                    <tr>
                        <td><b>${atleta.pos_ass ?? ""}</b></td>
                        <td>${atleta.pos_mf ?? ""}</td>
                        <td>${atleta.pos_cat ?? ""}</td>
                        <td>${atleta.pettorale ?? ""}</td>
                        <td>${atleta.nome ?? ""}</td>
                        <td>${atleta.societa ?? ""}</td>
                        <td>${atleta.cat_nome ?? ""}</td>
                        <td><b>${atleta.tempo ?? ""}</b></td>
                    </tr>`;
            }
            tbody.innerHTML = html;
            ultimoHashTabella = nuovoHash;
        }

        // ==========================================
        // LISTENER PER UNA GARA SPECIFICA
        // ==========================================
        function ascoltaGara(idGara) {
            if (listenerAttivi[idGara]) return;
            listenerAttivi[idGara] = true;

            db.ref("classifica_live/" + idGara + "/info").on("value", (snap) => {
                infoCache[idGara] = snap.val() || {};
                if (idGara === garaAttiva) {
                    disegnaTabsGare();
                    disegnaTabsPercorsi();
                    aggiornaIntestazione();
                } else {
                    disegnaTabsGare();
                }
            });

            db.ref("classifica_live/" + idGara + "/atleti").on("value", (snap) => {
                atletiCache[idGara] = snap.val();
                if (idGara === garaAttiva) {
                    ultimoHashTabella = "";
                    aggiornaTabella();
                }
            });
        }

        function smettiAscoltoGara(idGara) {
            if (!listenerAttivi[idGara]) return;
            db.ref("classifica_live/" + idGara + "/info").off();
            db.ref("classifica_live/" + idGara + "/atleti").off();
            delete listenerAttivi[idGara];
            delete infoCache[idGara];
            delete atletiCache[idGara];
        }

        // ==========================================
        // SCOPERTA DINAMICA DELLE GARE
        // ==========================================
        function aggiornaListaGare() {
            db.ref("classifica_live").once("value").then((snap) => {
                const tutte = snap.val() || {};
                const nuoviId = Object.keys(tutte);

                for (const id of nuoviId) {
                    if (!listaGare.some(g => g.id === id)) {
                        listaGare.push({ id: id });
                        ascoltaGara(id);
                    }
                }

                const idAttuali = nuoviId;
                for (let i = listaGare.length - 1; i >= 0; i--) {
                    if (!idAttuali.includes(listaGare[i].id)) {
                        smettiAscoltoGara(listaGare[i].id);
                        listaGare.splice(i, 1);
                    }
                }

                if (!garaAttiva || !listaGare.some(g => g.id === garaAttiva)) {
                    garaAttiva = listaGare[0] ? listaGare[0].id : null;
                }

                disegnaTabsGare();
                disegnaTabsPercorsi();
                aggiornaIntestazione();
                aggiornaTabella();
            }).catch((err) => {
                console.error("Errore lettura lista gare:", err);
            });
        }

        // ==========================================
        // CONNESSIONE
        // ==========================================
        let primaLettura = true;
        db.ref(".info/connected").on("value", (snap) => {
            const connesso = snap.val() === true;
            if (primaLettura) {
                primaLettura = false;
                if (connesso) return;
            }
            mostraBannerRete(connesso ? "ok" : "offline");
        });

        // ==========================================
        // INIT
        // ==========================================
        leggiStatoDaURL();
        percorsiDisponibili = ["1", "2", "3"];
        disegnaTabsGare();
        disegnaTabsPercorsi();
        aggiornaIntestazione();

        aggiornaListaGare();
        setInterval(aggiornaListaGare, 10000);
    </script>
</body>
</html>
